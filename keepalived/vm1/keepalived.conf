# ============================================
# Keepalived config — VM1 MASTER (nginxlove1)
# IP: 10.2.159.18 | Peer: 10.2.159.19
# VIP: 10.2.159.20
# ============================================

global_defs {
    router_id CADDY_WAF_VM1
    script_user root
    enable_script_security
}

vrrp_script chk_caddy {
    script       "/usr/local/bin/check_caddy_waf.sh"
    interval     3       # Chạy mỗi 3 giây
    timeout      5       # Script tối đa 5 giây
    weight       -30     # Trừ 30 priority nếu fail (100-30=70 < BACKUP 90 → failover)
    fall         3       # Fail 3 lần liên tiếp (9s) mới giảm priority
    rise         2       # Recover 2 lần liên tiếp (6s) mới tăng priority lại
}

vrrp_instance VI_CADDY_WAF {
    state     MASTER
    interface enp1s0
    virtual_router_id 52        # 1-255, phải giống trên cả 2 node
    priority  100               # MASTER: 100 | BACKUP: 90
                                # Khi fail: 100-30=70 < 90 → VM2 nhận VIP

    advert_int 1                # Gửi advertisement mỗi 1 giây

    authentication {
        auth_type PASS
        auth_pass Caddy@WAF2026  # Phải giống trên cả 2 node — đổi giá trị này
    }

    # Unicast point-to-point (bỏ qua multicast, hoạt động tốt trong VLAN/VPC)
    unicast_src_ip 10.2.159.18
    unicast_peer {
        10.2.159.19
    }

    virtual_ipaddress {
        10.2.159.20/32 dev enp1s0 label enp1s0:vip
    }

    track_script {
        chk_caddy
    }

    # Notify scripts — gọi với argument là state mới
    notify_master "/usr/local/bin/keepalived_notify.sh MASTER"
    notify_backup "/usr/local/bin/keepalived_notify.sh BACKUP"
    notify_fault  "/usr/local/bin/keepalived_notify.sh FAULT"
}
