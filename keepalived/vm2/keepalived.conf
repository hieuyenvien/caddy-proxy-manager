# ============================================
# Keepalived config — VM2 BACKUP (nginxlove2)
# IP: 10.2.159.19 | Peer: 10.2.159.18
# VIP: 10.2.159.20
# ============================================

global_defs {
    router_id CADDY_WAF_VM2
    script_user root
    enable_script_security
}

vrrp_script chk_caddy {
    script       "/usr/local/bin/check_caddy_waf.sh"
    interval     3
    timeout      5
    weight       -30     # Trừ 30 priority (90-30=60 < MASTER 100)
    fall         3
    rise         2
}

vrrp_instance VI_CADDY_WAF {
    state     BACKUP
    interface enp1s0
    virtual_router_id 52        # Phải giống VM1
    priority  90                # Thấp hơn MASTER (100)

    advert_int 1

    authentication {
        auth_type PASS
        auth_pass Caddy@WAF2026  # Phải giống VM1
    }

    unicast_src_ip 10.2.159.19
    unicast_peer {
        10.2.159.18
    }

    virtual_ipaddress {
        10.2.159.20/32 dev enp1s0 label enp1s0:vip
    }

    track_script {
        chk_caddy
    }

    notify_master "/usr/local/bin/keepalived_notify.sh MASTER"
    notify_backup "/usr/local/bin/keepalived_notify.sh BACKUP"
    notify_fault  "/usr/local/bin/keepalived_notify.sh FAULT"
}
